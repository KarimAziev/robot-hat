name: CI

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GPIOZERO_PIN_FACTORY: mock
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYGAME_HIDE_SUPPORT_PROMPT: "1"
  PYTHONUNBUFFERED: "1"
  ROBOT_HAT_MOCK_SMBUS: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: pyright ./tests ./robot_hat

  minimum-dependencies:
    name: Minimum supported dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared minimum versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "gpiozero==2.0" \
            "pyserial==3.5" \
            "smbus2==0.4.3" \
            "tenacity==8.2.0"
          python -m pip install --editable . --no-deps
          python -m pip check

      - name: Run unit tests in mock mode
        run: python -m unittest discover -v

  test:
    name: Test (${{ matrix.name }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            python-version: "3.10"
          - name: Linux x64
            runner: ubuntu-24.04
            python-version: "3.11"
          - name: Linux x64
            runner: ubuntu-24.04
            python-version: "3.12"
          - name: Linux x64
            runner: ubuntu-24.04
            python-version: "3.13"
          - name: Linux x64
            runner: ubuntu-24.04
            python-version: "3.14"
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            python-version: "3.12"
          - name: macOS ARM64
            runner: macos-15
            python-version: "3.12"
          - name: Windows x64
            runner: windows-2025
            python-version: "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip check

      - name: Run unit tests in mock mode
        run: python -m unittest discover -v

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Run tests with branch coverage
        run: |
          python -m coverage run -m unittest discover
          python -m coverage report
          python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
          flags: unittests
          name: python-3.12

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test the built wheel
        run: |
          python -m venv .package-test
          .package-test/bin/python -m pip install --upgrade pip
          .package-test/bin/python -m pip install dist/*.whl
          .package-test/bin/python -m pip check
          .package-test/bin/python - <<'PY'
          from importlib.metadata import files, metadata, requires
          from importlib.resources import files as resource_files

          package_metadata = metadata("robot-hat")
          dependencies = requires("robot-hat") or []
          distribution_files = files("robot-hat") or []

          assert package_metadata["Requires-Python"] == ">=3.10"
          assert any(item.lower().startswith("gpiozero") for item in dependencies)
          assert any(item.lower().startswith("pyserial") for item in dependencies)
          assert any(item.lower().startswith("smbus2") for item in dependencies)
          assert any(item.lower().startswith("tenacity") for item in dependencies)
          assert resource_files("robot_hat").joinpath("py.typed").is_file()
          assert not any(str(item).startswith("tests/") for item in distribution_files)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robot-hat-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
